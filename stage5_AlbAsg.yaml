# Create the /Wordpress/DBPassword SecureString before deploying; see README.md.
AWSTemplateFormatVersion: 2010-09-09
Transform: 'AWS::LanguageExtensions'
Description: >-
  WordPress application AWS architecture evolution - Stage 5
  Auto Scaling group behind ALB, with RDS database and EFS shared storage
Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI.
    #Automatically fetches latest AL2023 AMI ID from AWS Systems Manager
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64'
  Subdomain:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: Empty or a DNS label such as "myblog".
    Description: >-
      Empty: use ALB HTTP URL. Non-empty: first label for the custom WordPress URL, e.g. myblog.
  RootDomain:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: Empty or a hosted zone name such as example.com.
    Description: >-
      Empty: use ALB HTTP URL. Non-empty: Route 53 hosted zone name for the custom WordPress URL, e.g. example.com.
  Stage4CutoverMode:
    Type: String
    Default: auto
    AllowedValues:
      - auto
      - require
    Description: >-
      auto: greenfield or stage4-to-stage5 update. require: fail the update unless this same stack still contains the
      stage4 WordpressEC2 singleton so its termination protection can be released. Stage4 data is preserved through
      existing RDSinstance and WordpressEFS logical resources; the stage4 root snapshot is only a rollback backup.

Rules:
  CustomDomainBothOrNeither:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref Subdomain, '']
            - !Equals [!Ref RootDomain, '']
          - !And
            - !Not [!Equals [!Ref Subdomain, '']]
            - !Not [!Equals [!Ref RootDomain, '']]
        AssertDescription: >-
          Set both Subdomain and RootDomain, or leave both empty.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref Subdomain, '']]
    - !Not [!Equals [!Ref RootDomain, '']]

Resources:

# Network skeleton with all 3 tiers of subnets: Public, Db & App
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.125.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value: !Sub 'vpc-${AWS::Region}'
  SubnetPublicA:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.125.0.0/20
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '00::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-public-A
  SubnetPublicB:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.125.16.0/20
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '01::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-public-B
  SubnetPublicC:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      CidrBlock: 10.125.32.0/20
      MapPublicIpOnLaunch: true
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '02::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-public-C
  SubnetDbA:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.125.48.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '03::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-db-A
  SubnetDbB:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.125.64.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '04::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-db-B
  SubnetDbC:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      CidrBlock: 10.125.80.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '05::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-db-C
  SubnetAppA:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.125.96.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '06::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-app-A
  SubnetAppB:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.125.112.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '07::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-app-B
  SubnetAppC:
    Type: AWS::EC2::Subnet
    DependsOn: IPv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      CidrBlock: 10.125.128.0/20
      AssignIpv6AddressOnCreation: true
      Ipv6CidrBlock: 
        Fn::Sub:
          - "${VpcPart}${SubnetPart}"
          - SubnetPart: '08::/64'
            VpcPart: !Select [ 0, !Split [ '00::/56', !Select [ 0, !GetAtt VPC.Ipv6CidrBlocks ]]]
      Tags:
        - Key: Name
          Value: sn-app-C
  IPv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPC
      AmazonProvidedIpv6CidrBlock: true
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
      - Key: Name
        Value: !Sub 'igw-${AWS::Region}'
  InternetGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  RTPublic: 
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: !Sub 'vpc-rt-public-${AWS::Region}'
  RTPublicDefaultIPv4: 
    Type: 'AWS::EC2::Route'
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId:
        Ref: RTPublic
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId:
        Ref: InternetGateway
  RTPublicDefaultIPv6: 
    Type: 'AWS::EC2::Route'
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId:
        Ref: RTPublic
      DestinationIpv6CidrBlock: '::/0'
      GatewayId:
        Ref: InternetGateway
  RTAssociationPubA:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref SubnetPublicA
      RouteTableId:
        Ref: RTPublic
  RTAssociationPubB:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref SubnetPublicB
      RouteTableId:
        Ref: RTPublic
  RTAssociationPubC:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref SubnetPublicC
      RouteTableId:
        Ref: RTPublic
# SSM Parameters for WordPress configuration
  DBName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/Wordpress/DBName"
      Description: "Wordpress Database Name"
      Type: String
      Value: "wordpressdb"
  DBUser:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/Wordpress/DBUser"
      Description: "Wordpress Database User"
      Type: String
      Value: "wordpressuser"
  DBEndpoint:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/Wordpress/DBEndpoint"
      Description: "Wordpress Endpoint Name"
      Type: String
      #Stage 3+: Points to RDS MySQL endpoint (not localhost)
      Value: !GetAtt RDSinstance.Endpoint.Address
  EFSfsid:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/Wordpress/EFSfsid"
      Description: "File System ID of the EFS resource for storing Wordpress content"
      Type: String
      #Stage 4+: EFS file system ID for shared wp-content across instances
      Value: !GetAtt WordpressEFS.FileSystemId
  ALBDNSName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/Wordpress/ALBDNSName" 
      Description: "DNS Name of the wordpress-alb"
      Type: String
      #Stage 5: ALB DNS used for WordPress URLs
      Value: !GetAtt WordpressALB.DNSName
  WordpressPublicURL:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/Wordpress/PublicURL"
      Description: "Public URL WordPress should use for home and siteurl"
      Type: String
      Value: !If
        - HasCustomDomain
        - !Sub 'https://${Subdomain}.wp.${RootDomain}'
        - !Sub 'http://${WordpressALB.DNSName}'

# Optional Route 53 + ACM resources for custom WordPress URL
  HostedZoneLookupRole:
    Type: AWS::IAM::Role
    Condition: HasCustomDomain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub hosted-zone-lookup-${AWS::StackName}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:ListHostedZonesByName
                Resource: '*'

  HostedZoneLookupLambda:
    Type: AWS::Lambda::Function
    Condition: HasCustomDomain
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt HostedZoneLookupRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import cfnresponse
          import boto3

          def handler(event, context):
              phys = event.get("PhysicalResourceId") or "hosted-zone-lookup"
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, phys)
                      return
                  domain = (event["ResourceProperties"].get("DomainName") or "").rstrip(".") + "."
                  r53 = boto3.client("route53")
                  zones = r53.list_hosted_zones_by_name(DNSName=domain).get("HostedZones", [])
                  matches = [z for z in zones if z["Name"] == domain and not z.get("Config", {}).get("PrivateZone")]
                  if not matches:
                      raise ValueError("Route 53 hosted zone not found: " + domain)
                  zone_id = matches[0]["Id"].split("/")[-1]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {"HostedZoneId": zone_id}, zone_id)
              except Exception as e:
                  print(repr(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)[:2048]}, phys)

  HostedZoneLookup:
    Type: Custom::HostedZoneLookup
    Condition: HasCustomDomain
    Properties:
      ServiceToken: !GetAtt HostedZoneLookupLambda.Arn
      DomainName: !Ref RootDomain

  WordpressCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Sub '${Subdomain}.wp.${RootDomain}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub '${Subdomain}.wp.${RootDomain}'
          HostedZoneId: !GetAtt HostedZoneLookup.HostedZoneId

  WordpressAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !GetAtt HostedZoneLookup.HostedZoneId
      Name: !Sub '${Subdomain}.wp.${RootDomain}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt WordpressALB.DNSName
        HostedZoneId: !GetAtt WordpressALB.CanonicalHostedZoneID
        EvaluateTargetHealth: true

# Let CloudFormation remove the former stage4 singleton instance during update
  Stage4InstanceReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub stage4-instance-release-${AWS::StackName}
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                Resource: !Sub
                  'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action:
                  - ec2:ModifyInstanceAttribute
                Resource: '*'

  Stage4InstanceReleaseLambda:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt Stage4InstanceReleaseRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import cfnresponse
          import boto3

          def handler(event, context):
              phys = event.get("PhysicalResourceId") or "stage4-instance-release"
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, phys)
                      return
                  props = event["ResourceProperties"]
                  stack = props["StackName"]
                  mode = props.get("CutoverMode", "auto")
                  cfn = boto3.client("cloudformation")
                  ec2 = boto3.client("ec2")
                  try:
                      res = cfn.describe_stack_resource(StackName=stack, LogicalResourceId="WordpressEC2")
                      instance_id = res["StackResourceDetail"]["PhysicalResourceId"]
                  except Exception as e:
                      print("No stage4 WordpressEC2 to release", repr(e))
                      if mode == "require":
                          raise ValueError("Stage4CutoverMode=require but this stack has no stage4 WordpressEC2 resource")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {"Skipped": "true"}, phys)
                      return
                  if instance_id.startswith("i-"):
                      ec2.modify_instance_attribute(
                          InstanceId=instance_id,
                          DisableApiTermination={"Value": False},
                      )
                      phys = instance_id
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {"InstanceId": instance_id}, phys)
              except Exception as e:
                  print(repr(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)[:2048]}, phys)

  Stage4InstanceRelease:
    Type: Custom::Stage4InstanceRelease
    Properties:
      ServiceToken: !GetAtt Stage4InstanceReleaseLambda.Arn
      StackName: !Ref AWS::StackName
      CutoverMode: !Ref Stage4CutoverMode

# WordPress auto-scaling with ALB + ASG + RDS + EFS
  SGWordpress:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupName: wordpress-sg
      GroupDescription: "Allow HTTP traffic to WordPress web server"
      SecurityGroupIngress: 
        - Description: "Allow HTTP from ALB only (port 80)"
          IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          SourceSecurityGroupId: !Ref SGALB
  SGDatabase:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupName: database-sg
      GroupDescription: "Allow MySQL connections from WordPress instances only"
      SecurityGroupIngress: 
        - Description: "Allow MySQL from WordPress security group (port 3306)"
          IpProtocol: tcp
          FromPort: '3306'
          ToPort: '3306'
          SourceSecurityGroupId: !Ref SGWordpress  #Only WordPress can connect
  SGEFS:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupName: efs-sg
      GroupDescription: "Allow NFS connections from WordPress instances only"
      SecurityGroupIngress: 
        - Description: "Allow NFS from WordPress security group (port 2049)"
          IpProtocol: tcp
          FromPort: '2049'
          ToPort: '2049'
          SourceSecurityGroupId: !Ref SGWordpress  #Only WordPress can mount EFS
  SGALB:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      VpcId: !Ref VPC
      GroupName: alb-sg
      GroupDescription: "Allow public traffic to Application Load Balancer"
      SecurityGroupIngress: 
        - Description: "Allow HTTP IPv4 from anywhere (port 80)"
          IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: '0.0.0.0/0'  # Production: use CloudFront or restrict as needed
  SGALBHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCustomDomain
    Properties:
      GroupId: !Ref SGALB
      Description: "Allow HTTPS IPv4 from anywhere (port 443)"
      IpProtocol: tcp
      FromPort: '443'
      ToPort: '443'
      CidrIp: '0.0.0.0/0'
  WordpressInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref WordpressRole
  WordpressRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
              - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns: 
        - "arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy"
        - "arn:aws:iam::aws:policy/AmazonSSMFullAccess"
        - "arn:aws:iam::aws:policy/AmazonElasticFileSystemClientFullAccess"
      Policies:
        # Let ASG instances signal CloudFormation when WordPress bootstrap finishes.
        - PolicyName: cfn-signal
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub
                  'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

# Launch template for ASG instances: app only, EFS for content, ALB DNS or custom domain for WordPress URLs
  WordpressLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn:
      - DBName
      - DBUser    
      - DBEndpoint
      - EFSfsid
      - ALBDNSName
      - WordpressPublicURL
    Properties:
      LaunchTemplateName: "Wordpress"
      VersionDescription: "Launches app only. Uses EFS for content. ALB home added to WP Database."
      LaunchTemplateData: 
        ImageId: !Ref LatestAmiId
        InstanceType: t2.micro
        SecurityGroupIds:
          - !GetAtt SGWordpress.GroupId
        IamInstanceProfile:
          Arn: !GetAtt WordpressInstanceProfile.Arn
        #Allow instance termination for testing
        DisableApiTermination: false
        CreditSpecification:
          CpuCredits: Standard
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            if ! rpm -q aws-cfn-bootstrap >/dev/null 2>&1; then dnf install -y aws-cfn-bootstrap; fi
            _cfn_exit() {
              local s=$?
              if [ -x /opt/aws/bin/cfn-signal ]; then
                /opt/aws/bin/cfn-signal -e "$s" --stack ${AWS::StackId} --resource WordpressASG --region ${AWS::Region}
              fi
            }
            trap _cfn_exit EXIT
            set -xe
            # Step 1 - Import parameter store values
            DBName=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBName --query Parameters[0].Value --output text)
            DBUser=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBUser --query Parameters[0].Value --output text)
            DBPassword=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBPassword --with-decryption --query Parameters[0].Value --output text)
            DBEndpoint=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBEndpoint --query Parameters[0].Value --output text)
            EFSfsid=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/EFSfsid --query Parameters[0].Value --output text)
            PublicURL=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/PublicURL --query Parameters[0].Value --output text)
            ALBURL="http://${WordpressALB.DNSName}"
            # Step 2 - Run system updates
            dnf -y --refresh upgrade || true
            # Step 3 - Install system software - Web server only (no local database)
            dnf install -y wget httpd php php-mysqlnd php-fpm php-mysqli php-json php-mbstring php-xml php-gd php-opcache php-intl php-zip php-devel
            dnf install -y curl rsync || true
            dnf install -y stress || true
            dnf install -y amazon-efs-utils || true
            # Step 4 - Web Server Online - and set to startup
            systemctl enable httpd
            systemctl start httpd
            # Step 5 - Download & install Wordpress
            wget https://wordpress.org/latest.tar.gz -P /var/www/html
            cd /var/www/html
            tar -zxvf latest.tar.gz
            cp -rvf wordpress/* .
            rm -R wordpress
            rm latest.tar.gz
            # Step 6 - Configure Wordpress
            cp ./wp-config-sample.php ./wp-config.php
            sed -i "s/'database_name_here'/'$DBName'/g" wp-config.php
            sed -i "s/'username_here'/'$DBUser'/g" wp-config.php
            sed -i "s/'password_here'/'$DBPassword'/g" wp-config.php
            sed -i "s/'localhost'/'$DBEndpoint'/g" wp-config.php
            # Step 7 - Use the public load balancer address for Wordpress site links
            if ! grep -q 'Follow load balancer public URL' wp-config.php; then
              WPCONFIG_INSERT_TMP=$(mktemp)
              WPCONFIG_MERGED_TMP=$(mktemp)
              cat > "$WPCONFIG_INSERT_TMP" <<WPCONFIG_EOF
            /* Follow load balancer public URL for WP_HOME and WP_SITEURL. */
            if (!empty(\$_SERVER['HTTP_X_FORWARDED_PROTO']) && \$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                \$_SERVER['HTTPS'] = 'on';
            }
            define('WP_HOME', '$PublicURL');
            define('WP_SITEURL', '$PublicURL');
            WPCONFIG_EOF
              awk 'NR==FNR { buf = buf $0 ORS; next } /stop editing! Happy publishing/ && !done { printf "%s", buf; done=1 } { print }' "$WPCONFIG_INSERT_TMP" wp-config.php > "$WPCONFIG_MERGED_TMP"
              mv "$WPCONFIG_MERGED_TMP" wp-config.php
              rm -f "$WPCONFIG_INSERT_TMP"
            fi
            # Step 8 - Mount shared wp-content from EFS
            EFS_DNS_NAME="$EFSfsid.efs.${AWS::Region}.amazonaws.com"
            EFS_FSTAB_SPEC="$EFSfsid:/"
            EFS_FSTAB_TYPE="efs"
            EFS_FSTAB_OPTIONS="_netdev,tls,iam"
            mount_wp_content_efs() {
              EFS_MOUNT_TARGET="$1"
              if mount -t efs -o tls,iam "$EFSfsid:/" "$EFS_MOUNT_TARGET" 2>/dev/null; then
                EFS_FSTAB_SPEC="$EFSfsid:/"
                EFS_FSTAB_TYPE="efs"
                EFS_FSTAB_OPTIONS="_netdev,tls,iam"
                return 0
              fi
              if mount -t efs -o tls "$EFSfsid:/" "$EFS_MOUNT_TARGET" 2>/dev/null; then
                EFS_FSTAB_SPEC="$EFSfsid:/"
                EFS_FSTAB_TYPE="efs"
                EFS_FSTAB_OPTIONS="_netdev,tls"
                return 0
              fi
              if mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport "$EFS_DNS_NAME:/" "$EFS_MOUNT_TARGET" 2>/dev/null; then
                EFS_FSTAB_SPEC="$EFS_DNS_NAME:/"
                EFS_FSTAB_TYPE="nfs4"
                EFS_FSTAB_OPTIONS="_netdev,nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport"
                return 0
              fi
              return 1
            }
            mkdir -p /mnt/wp-content-efs
            for attempt in $(seq 1 60); do
              if mountpoint -q /mnt/wp-content-efs; then break; fi
              mount_wp_content_efs /mnt/wp-content-efs || true
              mountpoint -q /mnt/wp-content-efs && break
              sleep 5
            done
            if ! mountpoint -q /mnt/wp-content-efs; then
              echo "FATAL: could not mount EFS $EFSfsid at /mnt/wp-content-efs" >&2
              exit 1
            fi
            if [ -z "$(ls -A /mnt/wp-content-efs 2>/dev/null)" ]; then
              if command -v rsync >/dev/null 2>&1; then
                rsync -a /var/www/html/wp-content/ /mnt/wp-content-efs/
              else
                cp -a /var/www/html/wp-content/. /mnt/wp-content-efs/
              fi
            fi
            umount /mnt/wp-content-efs 2>/dev/null || true
            rm -rf /var/www/html/wp-content
            mkdir -p /var/www/html/wp-content
            if ! grep -qE '^[^#].*[[:space:]]/var/www/html/wp-content[[:space:]]+efs[[:space:]]' /etc/fstab; then
              echo "$EFS_FSTAB_SPEC /var/www/html/wp-content $EFS_FSTAB_TYPE $EFS_FSTAB_OPTIONS 0 0" >> /etc/fstab
            fi
            mount_wp_content_efs /var/www/html/wp-content
            mkdir -p /var/www/html/wp-content/uploads
            # Step 9 - Fix the permissions
            usermod -a -G apache ec2-user   
            chown -R ec2-user:apache /var/www
            chmod 2775 /var/www
            find /var/www -type d -exec chmod 2775 {} \; 2>/dev/null || true
            find /var/www -type f -exec chmod 0664 {} \; 2>/dev/null || true
            SELINUX_STATE=$(getenforce 2>/dev/null || true)
            if [ "$SELINUX_STATE" = "Enforcing" ] || [ "$SELINUX_STATE" = "Permissive" ]; then
              setsebool -P httpd_use_nfs 1 2>/dev/null || true
            fi
            # Step 10 - Point Wordpress content at the load balancer URL
            if [ ! -f /var/www/html/wp-cli.phar ]; then
              if command -v curl >/dev/null 2>&1; then
                curl -fsSLo /var/www/html/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar || true
              fi
              if [ ! -f /var/www/html/wp-cli.phar ]; then
                wget -q -O /var/www/html/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar || true
              fi
            fi
            if [ -f /var/www/html/wp-cli.phar ]; then
              wp_get_raw_option() {
                WP_RAW_OPTION_NAME="$1" php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root eval 'global $wpdb; echo $wpdb->get_var($wpdb->prepare("select option_value from {$wpdb->options} where option_name=%s", getenv("WP_RAW_OPTION_NAME")));' 2>/dev/null || true
              }
              PREVIOUS_HOME_URL=$(wp_get_raw_option home)
              PREVIOUS_SITEURL=$(wp_get_raw_option siteurl)
              if [ -z "$PREVIOUS_HOME_URL" ]; then
                PREVIOUS_HOME_URL=$(php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root option get home 2>/dev/null || true)
              fi
              if [ -z "$PREVIOUS_SITEURL" ]; then
                PREVIOUS_SITEURL=$(php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root option get siteurl 2>/dev/null || true)
              fi
              wp_search_replace_if_changed() {
                SEARCH_REPLACE_OLD_VALUE="$1"
                SEARCH_REPLACE_NEW_VALUE="$2"
                if [ -n "$SEARCH_REPLACE_OLD_VALUE" ] && [ "$SEARCH_REPLACE_OLD_VALUE" != "$SEARCH_REPLACE_NEW_VALUE" ]; then
                  php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root search-replace "$SEARCH_REPLACE_OLD_VALUE" "$SEARCH_REPLACE_NEW_VALUE" --all-tables || true
                fi
              }
              php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root option update home "$PublicURL" || true
              php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root option update siteurl "$PublicURL" || true
              wp_search_replace_if_changed "$PREVIOUS_HOME_URL" "$PublicURL"
              wp_search_replace_if_changed "$PREVIOUS_SITEURL" "$PublicURL"
              wp_search_replace_if_changed "$ALBURL" "$PublicURL"
              PUBLIC_URL_HTTP=$(printf '%s' "$PublicURL" | sed 's|^https://|http://|')
              wp_search_replace_if_changed "$PUBLIC_URL_HTTP" "$PublicURL"
              for PREVIOUS_HOME_OR_SITEURL in "$PREVIOUS_HOME_URL" "$PREVIOUS_SITEURL"; do
                [ -z "$PREVIOUS_HOME_OR_SITEURL" ] && continue
                PREVIOUS_URL_WITHOUT_TRAILING_SLASHES=$(printf '%s' "$PREVIOUS_HOME_OR_SITEURL" | sed 's|/*$||')
                PREVIOUS_URL_WITH_TRAILING_SLASH_AFTER_HOST="$PREVIOUS_URL_WITHOUT_TRAILING_SLASHES/"
                wp_search_replace_if_changed "$PREVIOUS_URL_WITHOUT_TRAILING_SLASHES" "$PublicURL"
                wp_search_replace_if_changed "$PREVIOUS_URL_WITH_TRAILING_SLASH_AFTER_HOST" "$PublicURL"
              done
            else
              echo "WARN: wp-cli download unavailable; skipping WordPress URL database refresh" >&2
            fi
            systemctl restart httpd

# RDS resources needed to split Database from the WordpressEC2 instance
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: "WordPressRDSSubnetGroup"     
      DBSubnetGroupDescription: "RDS Subnet Group for the WordPress DB"
      SubnetIds: 
        - !Ref SubnetDbA
        - !Ref SubnetDbB
        - !Ref SubnetDbC
      Tags:
        - Key: Name
          Value: "WordPressRDSSubnetGroup"
  RDSinstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      Engine: mysql
      #Mandatory MySQL parameter aka "Initial database name" in console
      DBName: !GetAtt DBName.Value 
      #Free tier eligible settings
      EngineVersion: 8.4 #Latest MySQL LTS
      DBInstanceClass: "db.t3.micro"
      AllocatedStorage: 20     
      StorageType: gp3
      #Default settings
      # NetworkType: IPV4
      # PubliclyAccessible: false
      MultiAZ: false
      DBInstanceIdentifier: !GetAtt DBName.Value
      MasterUsername: !GetAtt DBUser.Value
      MasterUserPassword: "{{resolve:ssm-secure:/Wordpress/DBPassword}}"
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !Ref SGDatabase
      AvailabilityZone: !GetAtt SubnetPublicA.AvailabilityZone

# EFS for shared WordPress content across instances
  WordpressEFS:
    Type: 'AWS::EFS::FileSystem'
    Properties:
      FileSystemTags:
        - Key: Name
          Value: "wordpress-efs"
      BackupPolicy:
        Status: ENABLED
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      Encrypted: false
      ThroughputMode: bursting
      PerformanceMode: generalPurpose
  Fn::ForEach::MountTargets:
    - zone
    - [A, B, C]
    - 'MountTarget${zone}':
        Type: AWS::EFS::MountTarget
        Properties:
          FileSystemId: !Ref WordpressEFS
          SubnetId:
            Ref:
              !Sub 'SubnetApp${zone}'
          SecurityGroups:
            - !GetAtt SGEFS.GroupId

# Application Load Balancer for distributing traffic
  WordpressALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: "wordpress-alb"
      #Application Load Balancer in public subnets for internet access
      Subnets: 
        - !Ref SubnetPublicA
        - !Ref SubnetPublicB
        - !Ref SubnetPublicC
      SecurityGroups: 
        - !Ref SGALB
  WordpressALBHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WordpressALB
      Protocol: HTTP
      Port: 80
      DefaultActions: 
        - !If
          - HasCustomDomain
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref ALBTargetGroup
  WordpressALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCustomDomain
    Properties:
      LoadBalancerArn: !Ref WordpressALB
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref WordpressCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: wordpress-alb-tg
      TargetType: instance
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VPC
      #Default settings
      # HealthCheckEnabled: true
      # HealthCheckProtocol: HTTP
      # HealthCheckPath: '/'
      Matcher:
        HttpCode: '200-399'
      ProtocolVersion:  HTTP1

# Auto Scaling Group for WordPress instances
  WordpressASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - InternetGatewayAttachment
      - WordpressALBHttpListener
      - Stage4InstanceRelease
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      AutoScalingGroupName: wordpress-asg
      LaunchTemplate:
          LaunchTemplateId: !Ref WordpressLaunchTemplate
          Version: !GetAtt WordpressLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier: [!Ref SubnetPublicA,!Ref SubnetPublicB,!Ref SubnetPublicC]
      TargetGroupARNs: [!Ref ALBTargetGroup]
      HealthCheckType: ELB  #Use ALB health checks (not just EC2 status checks)
      HealthCheckGracePeriod: 300  #Wait 5 min for instance to fully initialize
      MetricsCollection: [Granularity: 1Minute]  #Detailed CloudWatch metrics
      DesiredCapacity: 1  #Normal operating state
      MinSize: 1  #Always keep at least one instance running
      MaxSize: 3  #Never exceed 3 instances (cost control)
      Tags:
        - Key: Name
          Value: wordpress-asg
          PropagateAtLaunch: true

# Auto-scaling policies: Hybrid approach with CPU credits + CPU utilization
  #For "M out of N" alarm, M = DatapointsToAlarm & N = EvaluationPeriods

  #Scale-out Policy #1: Low CPU credits (t2.micro resource constraint)
  WpLowCreditScaleOut:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WordpressASG
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: 300
  WpLowCreditAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "CPU Credits Low - Scale Out" 
      MetricName: 'CPUCreditBalance'
      Namespace: 'AWS/EC2'
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref WordpressASG      
      Statistic: 'Minimum'  #Detects if ANY instance is critically low
      Period: 120  #2-minute evaluation periods
      Threshold: 3  #Critical threshold (t2.micro has max 144 credits)
      ComparisonOperator: LessThanThreshold
      #Alarm triggers when 3 out of 4 datapoints are below threshold (6-8 minutes)
      DatapointsToAlarm: 3
      EvaluationPeriods: 4
      AlarmDescription: "Scale out when ANY instance drops below 3 credits (3 of 4 datapoints = critically low burst capacity)"
      AlarmActions: [!Ref WpLowCreditScaleOut ]

  #Scale-out Policy #2: High CPU utilization (normal scaling)
  WpHighCpuScaleOut:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WordpressASG
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: 300
  WpHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "CPU Utilization High - Scale Out" 
      MetricName: 'CPUUtilization'
      Namespace: 'AWS/EC2'
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref WordpressASG      
      Statistic: 'Average'  #Average across all instances in ASG
      Period: 120  #2-minute evaluation periods
      Threshold: 50  #50% sustained utilization warrants scaling
      ComparisonOperator: GreaterThanThreshold
      #Alarm triggers when 2 out of 3 datapoints exceed threshold (4-6 minutes)
      DatapointsToAlarm: 2
      EvaluationPeriods: 3
      AlarmDescription: "Scale out when CPU >50% for 4-6 min (sustained high load with available credits)"
      AlarmActions: [!Ref WpHighCpuScaleOut ]

  #Scale-in Policy: Low CPU utilization
  WpLowCpuScaleIn:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WordpressASG
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1
      Cooldown: 300
  WpLowCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "CPU Utilization Low - Scale In"
      MetricName: 'CPUUtilization'
      Namespace: 'AWS/EC2'
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref WordpressASG
      Statistic: 'Average'  #Average across all instances
      Period: 120  #2-minute evaluation periods
      Threshold: 15  #Low threshold (idle or minimal load)
      ComparisonOperator: LessThanThreshold
      #Alarm triggers when 2 out of 3 datapoints are below threshold (~6 minutes)
      DatapointsToAlarm: 2
      EvaluationPeriods: 3
      AlarmDescription: "Scale in when CPU <15% for ~6 min"
      AlarmActions: [!Ref WpLowCpuScaleIn ]

Outputs:
  WordpressURL:
    Description: Access WordPress at this URL.
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${Subdomain}.wp.${RootDomain}'
      - !Sub 'http://${WordpressALB.DNSName}'
