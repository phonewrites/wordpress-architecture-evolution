AWSTemplateFormatVersion: 2010-09-09
Description: WordPress architecture evolution - Stage 3 nested root stack. 
  Application server with separate RDS database
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Stage 3 configuration
      Parameters:
      - Stage3Mode
      - LatestAmiId
      - SourceAmiId
      - CfnMetadataNonce
    ParameterLabels:
      Stage3Mode:
        default: Stage 3 mode
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      SourceAmiId:
        default: Stage 2 source AMI ID
      CfnMetadataNonce:
        default: cfn-init refresh nonce
Parameters:
  Stage3Mode:
    Type: String
    Default: cutover
    AllowedValues:
    - prepare
    - cutover
    Description: prepare adds RDS while keeping stage 2 app running; cutover 
      replaces app with RDS-backed app tier.
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI for greenfield stage 3.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  SourceAmiId:
    Type: String
    Default: ''
    AllowedPattern: ^$|^ami-[a-z0-9]+$
    Description: Optional AMI created from stage 2 before cutover. Use for 
      same-stack upgrades to preserve wp-content files.
  CfnMetadataNonce:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2147483647
    Description: Increase on stack update so cfn-hup re-runs cfn-init.
Conditions:
  PrepareMode:
    Fn::Equals:
    - Ref: Stage3Mode
    - prepare
  CutoverMode:
    Fn::Equals:
    - Ref: Stage3Mode
    - cutover
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/090d0d833437db69d87986667aa4e332.template
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/9610d5e81cf3597e10cb87dd3bf46510.template
  AutomationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/d2e6dbe144726b2485f82759638c6a4c.template
      Parameters:
        RootStackName:
          Ref: AWS::StackName
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/316535f566d611ee10df7c691d4240b7.template
      Parameters:
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        DbSubnetAId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetAId
        DbSubnetBId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetBId
        DbSubnetCId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetCId
  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/4efaf4fdd30b6ab17253e310d343f078.template
      Parameters:
        DBEndpointValue:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DBEndpointAddress
  SingleServerStack:
    Type: AWS::CloudFormation::Stack
    Condition: PrepareMode
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/4bde0864ad542e8dab49a8cf7c6552fd.template
      Parameters:
        LatestAmiId:
          Ref: LatestAmiId
        SourceAmiId:
          Ref: SourceAmiId
        CfnMetadataNonce:
          Ref: CfnMetadataNonce
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetAId
        InstanceProfileName:
          Fn::GetAtt:
          - IamStack
          - Outputs.InstanceProfileName
  AppServerStack:
    Type: AWS::CloudFormation::Stack
    Condition: CutoverMode
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/b6a0e8d14c123a5a102d6edbdd18e915.template
      Parameters:
        LatestAmiId:
          Ref: LatestAmiId
        SourceAmiId:
          Ref: SourceAmiId
        CfnMetadataNonce:
          Ref: CfnMetadataNonce
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetAId
        InstanceProfileName:
          Fn::GetAtt:
          - IamStack
          - Outputs.InstanceProfileName
Outputs:
  WordpressURL:
    Description: Open this URL to verify WordPress.
    Value:
      Fn::If:
      - PrepareMode
      - Fn::GetAtt:
        - SingleServerStack
        - Outputs.WordpressURL
      - Fn::GetAtt:
        - AppServerStack
        - Outputs.WordpressURL
  WordpressInstanceId:
    Description: Current WordPress EC2 instance ID.
    Value:
      Fn::If:
      - PrepareMode
      - Fn::GetAtt:
        - SingleServerStack
        - Outputs.WordpressInstanceId
      - Fn::GetAtt:
        - AppServerStack
        - Outputs.WordpressInstanceId
  WordpressInstanceAutoIP:
    Value:
      Fn::If:
      - PrepareMode
      - Fn::GetAtt:
        - SingleServerStack
        - Outputs.WordpressInstanceAutoIP
      - Fn::GetAtt:
        - AppServerStack
        - Outputs.WordpressInstanceAutoIP
  RdsEndpoint:
    Value:
      Fn::GetAtt:
      - DatabaseStack
      - Outputs.DBEndpointAddress
  PreStageSnapshotDocumentName:
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.PreStageSnapshotDocumentName
  MigrateLocalMariaDbToRdsDocumentName:
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.MigrateLocalMariaDbToRdsDocumentName
  AutomationRoleArn:
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.AutomationRoleArn
  VpcId:
    Value:
      Fn::GetAtt:
      - NetworkStack
      - Outputs.VpcId
